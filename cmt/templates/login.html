{% extends "base.html" %}
{% block title %}Login | CMT{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="form-card" style="max-width:440px">
      <h3>Author Login</h3>
      <form method="post">
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <button class="btn btn-primary btn-block" type="submit">Login</button>
        <p style="text-align:center;font-size:13.5px;margin-top:14px">New here? <a href="{{ url_for('register') }}" style="color:var(--blue);font-weight:700">Create an account</a></p>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Author Registration | CMT{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="form-card">
      <h3>Author Registration</h3>
      <p style="color:var(--muted);font-size:13.5px;margin-top:-8px">Create your author account to submit papers and register for conferences.</p>
      <form method="post">
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
          <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Mobile Number</label><input type="text" name="mobile" required></div>
          <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Institution / University</label><input type="text" name="institution" required></div>
          <div class="form-group">
            <label>Department</label>
            <select name="department" required>
              {% for d in departments %}<option value="{{ d.name }}">{{ d.name }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Designation</label><input type="text" name="designation" placeholder="e.g. Student, Faculty"></div>
          <div class="form-group"><label>Country</label><input type="text" name="country" value="India"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>City</label><input type="text" name="city" required></div>
          <div class="form-group"><label>Address</label><input type="text" name="address"></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Create Account</button>
        <p style="text-align:center;font-size:13.5px;margin-top:14px">Already have an account? <a href="{{ url_for('login') }}" style="color:var(--blue);font-weight:700">Log in</a></p>
      </form>
    </div>
  </div>
</section>
{% endblock %}

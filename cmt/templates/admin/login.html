{% extends "base.html" %}
{% block title %}Admin Login | CMT{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="form-card" style="max-width:440px">
      <h3>Admin Login</h3>
      <p style="color:var(--muted);font-size:13px;margin-top:-8px">Access the CMT Administrator Dashboard.</p>
      <form method="post">
        <div class="form-group"><label>Email / Username</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <button class="btn btn-primary btn-block" type="submit">Login to Dashboard</button>
      </form>
      <p style="text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px">Demo credentials: admin@ljuniversity.edu.in / Admin@123</p>
    </div>
  </div>
</section>
{% endblock %}
